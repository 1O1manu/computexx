name: Frontend Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Save SSH key
          echo "$EC2_SSH_KEY" > key.pem
          chmod 600 key.pem

          # Run deployment commands on EC2
          ssh -o StrictHostKeyChecking=no -i key.pem $EC2_USER@$EC2_HOST << 'DEPLOY'
            # Update packages and install Node.js & npm if missing
            if ! command -v npm &> /dev/null; then
              sudo apt update
              sudo apt install -y nodejs npm
            fi

            # Install PM2 globally if missing
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Clone repo if missing
            if [ ! -d "computexx" ]; then
              git clone https://github.com/1O1manu/computexx.git
            fi

            cd computexx
            git reset --hard
            git pull origin main

            cd ComputexFrontend
            npm install

            # Start or restart frontend app using PM2
            pm2 start npm --name "frontend" -- start -- --host 0.0.0.0 || pm2 restart frontend
            pm2 save
          DEPLOY
